name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_FIREBASE_API_KEY: 'test-key-for-build-only'
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: 'demo-mon-livret.firebaseapp.com'
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: 'demo-mon-livret'
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: 'demo-mon-livret.firebasestorage.app'
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '123456789'
      NEXT_PUBLIC_FIREBASE_APP_ID: '1:123456789:web:buildtest'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run security:history
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
